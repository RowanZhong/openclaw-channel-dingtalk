name: CI Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Run coverage
        run: pnpm test:coverage

      # The release gate must fail here, not at tag time: the runtime package
      # verifier inspects the real bundle (ambient env guard, process execution,
      # source maps), so pull requests build it too.
      - name: Build runtime package
        run: pnpm run build

      - name: Verify package runtime output
        run: pnpm run pack:check
