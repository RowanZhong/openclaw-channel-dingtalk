name: ClawHub Security Audit

# Manual-only. ClawScan is the only place a ClawHub security verdict exists, and
# it only runs server-side on a submitted version, so getting one always costs a
# throwaway version number. This workflow publishes that throwaway build on the
# dedicated `audit` dist-tag, waits for the verdict, and then withdraws it again
# so nothing installable is left behind.
#
# The verdict here is informational: it no longer gates
# `.github/workflows/clawhub-publish.yml`. Run it before cutting a release when
# you want to know what ClawScan thinks of the tree you are about to ship.

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Tag, branch, or SHA to audit. Leave empty to audit the ref this workflow runs on.
                required: false
                type: string
            allow_suspicious:
                description: Let the audit pass when ClawScan reports suspicious (P2 human override)
                required: false
                default: false
                type: boolean
            keep_audit_version:
                description: Keep the audited version on ClawHub for smoke testing instead of withdrawing it
                required: false
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    group: clawhub-audit-${{ github.ref }}
    cancel-in-progress: false

jobs:
    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 50
        permissions:
            contents: read

        steps:
            - name: Checkout the audited ref
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.ref }}
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install ClawHub CLI
              run: npm install --global clawhub@0.23.3

            - name: Build runtime package
              run: pnpm run build

            - name: Verify package runtime output
              run: pnpm run pack:check

            # Runs before any credential is loaded and uses the pinned CLI, so no
            # mutable third-party reference executes next to the publish token.
            - name: Offline plugin validation
              run: |
                  clawhub package validate . --out "$RUNNER_TEMP/plugin-inspector" --json

            - name: Resolve the audit version
              id: release
              shell: bash
              env:
                  AUDIT_REF: ${{ inputs.ref || github.ref_name }}
              run: |
                  set -euo pipefail
                  PACKAGE_NAME="$(node -p "require('./package.json').name")"
                  PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                  AUDITED_COMMIT="$(git rev-parse HEAD)"
                  AUDIT_VERSION="${PACKAGE_VERSION}-beta.${{ github.run_number }}.${{ github.run_attempt }}"

                  echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
                  echo "audited_commit=${AUDITED_COMMIT}" >> "$GITHUB_OUTPUT"
                  echo "audit_version=${AUDIT_VERSION}" >> "$GITHUB_OUTPUT"
                  echo "Audit build version: ${AUDIT_VERSION}"
                  echo "Audited ref: ${AUDIT_REF}"
                  echo "Audited commit: ${AUDITED_COMMIT}"

            - name: Verify the audit version is unused
              if: ${{ steps.release.outputs.audit_version != '' }}
              env:
                  AUDIT_PACKAGE: ${{ steps.release.outputs.package_name }}
                  AUDIT_VERSION: ${{ steps.release.outputs.audit_version }}
              run: |
                  set -euo pipefail
                  ENCODED="$(node -p "encodeURIComponent(process.env.AUDIT_PACKAGE)")"
                  STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
                    "https://clawhub.ai/api/v1/packages/${ENCODED}/versions/${AUDIT_VERSION}")"
                  if [[ "${STATUS}" != "404" ]]; then
                    echo "::error::Audit version ${AUDIT_VERSION} already exists on ClawHub (HTTP ${STATUS}). Re-run the workflow to get a fresh run number."
                    exit 1
                  fi
                  echo "Audit version ${AUDIT_VERSION} is unused (HTTP 404)."

            - name: Authenticate ClawHub CLI
              env:
                  CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub-config.json
                  CLAWHUB_SITE: https://clawhub.ai
                  CLAWHUB_REGISTRY: https://clawhub.ai
                  CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  if [[ -z "${CLAWHUB_TOKEN:-}" ]]; then
                    echo "::error::CLAWHUB_TOKEN secret is required for the ClawHub security audit."
                    exit 1
                  fi

                  clawhub auth login --token "${CLAWHUB_TOKEN}" --no-browser

            - name: Stamp the audit version
              if: ${{ steps.release.outputs.audit_version != '' }}
              env:
                  AUDIT_VERSION: ${{ steps.release.outputs.audit_version }}
              run: |
                  set -euo pipefail
                  # The CLI packs the folder itself and rejects a package whose
                  # version differs from the published one, so the runner copy of
                  # package.json has to carry the audit version. It is never committed.
                  node -e "const fs = require('node:fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.version = process.env.AUDIT_VERSION; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
                  echo "Stamped package.json version: $(node -p "require('./package.json').version") (runner-only, never committed)"

            - name: Publish the audit build and wait for ClawHub security checks
              id: publish
              if: ${{ steps.release.outputs.audit_version != '' }}
              env:
                  CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub-config.json
                  CLAWHUB_SITE: https://clawhub.ai
                  CLAWHUB_REGISTRY: https://clawhub.ai
                  AUDIT_PACKAGE: ${{ steps.release.outputs.package_name }}
                  AUDIT_REF: ${{ inputs.ref || github.ref_name }}
                  AUDIT_VERSION: ${{ steps.release.outputs.audit_version }}
              run: |
                  set -euo pipefail
                  SOURCE_COMMIT="$(git rev-parse HEAD)"

                  clawhub package publish . \
                    --tags audit \
                    --wait \
                    --wait-timeout 2400 \
                    --source-repo "${GITHUB_REPOSITORY}" \
                    --source-commit "${SOURCE_COMMIT}" \
                    --source-ref "${AUDIT_REF}" \
                    --source-path "." \
                    --json | tee publish.json

                  echo "ClawHub accepted ${AUDIT_PACKAGE}@${AUDIT_VERSION} and reported a terminal publication status."

            - name: Fetch the ClawHub security verdict
              if: ${{ always() && steps.release.outputs.audit_version != '' }}
              env:
                  AUDIT_PACKAGE: ${{ steps.release.outputs.package_name }}
                  AUDIT_VERSION: ${{ steps.release.outputs.audit_version }}
              run: |
                  set -euo pipefail
                  ENCODED="$(node -p "encodeURIComponent(process.env.AUDIT_PACKAGE)")"
                  STATUS="$(curl -sS -o verdict.json -w '%{http_code}' \
                    "https://clawhub.ai/api/v1/packages/${ENCODED}/versions/${AUDIT_VERSION}/security")"
                  echo "GET /security -> HTTP ${STATUS}"
                  echo "SECURITY_STATUS=${STATUS}" >> "$GITHUB_ENV"

            - name: Evaluate the audit verdict
              if: ${{ always() && steps.release.outputs.audit_version != '' }}
              env:
                  PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
                  BETA_VERSION: ${{ steps.release.outputs.audit_version }}
                  AUDIT_VERSION_RETENTION: ${{ inputs.keep_audit_version && 'kept' || 'withdrawn' }}
                  ALLOW_SUSPICIOUS: ${{ inputs.allow_suspicious && '1' || '0' }}
              run: node scripts/clawhub-beta-gate.mjs verdict.json

            - name: Explain how to proceed when the audit is not clean
              if: ${{ failure() }}
              run: |
                  echo "::error::The ClawHub security audit did not pass. This does not block publishing, but record the review before releasing. Re-run with an explicit override once the finding is understood: gh workflow run clawhub-audit.yml -f allow_suspicious=true"

            - name: Download the ClawHub audit report
              if: ${{ always() && steps.release.outputs.audit_version != '' }}
              continue-on-error: true
              env:
                  CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub-config.json
                  CLAWHUB_SITE: https://clawhub.ai
                  CLAWHUB_REGISTRY: https://clawhub.ai
                  AUDIT_PACKAGE: ${{ steps.release.outputs.package_name }}
                  AUDIT_VERSION: ${{ steps.release.outputs.audit_version }}
              run: |
                  set -euo pipefail
                  clawhub scan download "${AUDIT_PACKAGE}" \
                    --version "${AUDIT_VERSION}" \
                    --kind plugin \
                    --output "${GITHUB_WORKSPACE}/scan-report.zip"

            # Always runs, so the throwaway version cannot outlive the run by
            # accident. `--version` withdrawal is what keeps it off `latest`, which
            # is why the audit publishes on the dedicated `audit` dist-tag.
            # Note: the CLI has no dist-tag management command, so the `audit` tag
            # pointer itself cannot be removed; withdrawing leaves it dangling.
            - name: Withdraw the audit build
              if: ${{ always() && steps.release.outputs.audit_version != '' && !inputs.keep_audit_version }}
              env:
                  CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub-config.json
                  CLAWHUB_SITE: https://clawhub.ai
                  CLAWHUB_REGISTRY: https://clawhub.ai
                  AUDIT_PACKAGE: ${{ steps.release.outputs.package_name }}
                  AUDIT_VERSION: ${{ steps.release.outputs.audit_version }}
              run: |
                  set -euo pipefail
                  ENCODED="$(node -p "encodeURIComponent(process.env.AUDIT_PACKAGE)")"
                  VERSION_URL="https://clawhub.ai/api/v1/packages/${ENCODED}/versions/${AUDIT_VERSION}"

                  STATUS="$(curl -sS -o /dev/null -w '%{http_code}' "${VERSION_URL}")"
                  if [[ "${STATUS}" == "404" ]]; then
                    echo "Audit version ${AUDIT_VERSION} was never created; nothing to withdraw."
                    exit 0
                  fi

                  clawhub package delete "${AUDIT_PACKAGE}" --version "${AUDIT_VERSION}" --yes --json
                  echo "Withdrew ${AUDIT_PACKAGE}@${AUDIT_VERSION}; the version number stays reserved and the artifact can be restored with 'clawhub package undelete'."

                  STATUS_AFTER="$(curl -sS -o /dev/null -w '%{http_code}' "${VERSION_URL}")"
                  if [[ "${STATUS_AFTER}" != "404" ]]; then
                    echo "::error::Audit version ${AUDIT_VERSION} still resolves after withdrawal (HTTP ${STATUS_AFTER})."
                    exit 1
                  fi
                  echo "Verified: ${AUDIT_VERSION} no longer resolves (HTTP 404)."

            - name: Summarize the audit outcome
              if: ${{ always() }}
              env:
                  AUDIT_PACKAGE: ${{ steps.release.outputs.package_name }}
                  AUDIT_VERSION: ${{ steps.release.outputs.audit_version }}
                  KEEP_AUDIT_VERSION: ${{ inputs.keep_audit_version }}
              run: |
                  set -euo pipefail
                  {
                    echo "### ClawHub security audit"
                    echo ""
                    echo "- package: \`${AUDIT_PACKAGE}@${AUDIT_VERSION}\`"
                    echo "- security endpoint: \`GET /api/v1/packages/.../versions/${AUDIT_VERSION}/security\` (HTTP ${SECURITY_STATUS:-n/a})"
                    if [[ "${KEEP_AUDIT_VERSION}" == "true" ]]; then
                      echo "- audit version: **kept** (\`keep_audit_version=true\`)"
                      echo "- smoke test: \`openclaw plugins install clawhub:${AUDIT_PACKAGE}@${AUDIT_VERSION}\`"
                      echo "- clean up later: \`clawhub package delete ${AUDIT_PACKAGE} --version ${AUDIT_VERSION} --yes\`"
                    else
                      echo "- audit version: withdrawn automatically after the verdict"
                    fi
                    echo ""
                    echo "> This audit is informational. It does not gate \`clawhub-publish.yml\`."
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload the audit evidence
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: clawhub-audit-${{ steps.release.outputs.audit_version || github.run_number }}
                  if-no-files-found: ignore
                  retention-days: 30
                  path: |
                      verdict.json
                      gate-result.json
                      publish.json
                      scan-report.zip
